spring.application.name=synex-user-service
server.port=8081

spring.jackson.deserialization.fail-on-unknown-properties=true

auth0.domain=${AUTH0_DOMAIN}
auth0.management.domain=${AUTH0_MANAGEMENT_DOMAIN}
auth0.management.client-id=${AUTH0_MANAGEMENT_CLIENT_ID}
auth0.management.client-secret=${AUTH0_MANAGEMENT_CLIENT_SECRET}
auth0.management.audience=https://${AUTH0_MANAGEMENT_DOMAIN}/api/v2/

spring.security.oauth2.resourceserver.jwt.issuer-uri=${OAUTH2_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.audiences=${OAUTH2_AUDIENCE}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL}
